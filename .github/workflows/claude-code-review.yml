name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Uses whichever secret is set: ANTHROPIC_API_KEY (Console API key)
          # or CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, Pro/Max plans).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for ServeLLM, an OpenAI-compatible LLM serving API
            (FastAPI, llama-cpp-python, sentence-transformers). Focus on:
            - Correctness bugs and unhandled edge cases
            - Security issues (auth, API key handling, input validation)
            - Compatibility with the OpenAI API (request/response schemas, error format, streaming)
            - Concurrency/async issues in the inference engines
            - Missing or incorrect tests

            Post specific issues as inline comments on the relevant lines. Start every
            comment with a severity tag:
            - [High]: bugs, crashes, security holes, data loss, or broken OpenAI API compatibility
            - [Medium]: incorrect edge-case handling, concurrency risks, missing tests for new behavior
            - [Low]: minor improvements, readability, small inefficiencies

            Then post one short summary comment on the PR that lists the number of issues per
            severity, with the [High] ones first. Skip style nits that ruff already enforces.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
