services:
  api:
    build: .
    container_name: servellm-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./configs:/app/configs
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=true
    restart: unless-stopped
