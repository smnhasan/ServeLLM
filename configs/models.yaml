# LLM Serve — Model Registry
# Entries here are merged with the built-in defaults (gpt-oss-20b and the two
# embedding models). Only register models the active engine actually serves:
# the local engine runs a single GGUF model (LLM_MODEL_*), so any extra chat id
# listed here would silently be answered by that same model.
#
# Example entries:

models: []
